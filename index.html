<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Câu hỏi ôn thi Module 3 – 35 câu trắc nghiệm</title><style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#152033;--muted:#64748b;--line:#dbe3ef;--primary:#175cd3;--ok:#067647;--bad:#b42318;--warn:#b54708;--shadow:0 12px 32px rgba(20,32,51,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 Inter,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1500px;margin:auto;padding:11px 20px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:18px;white-space:nowrap}.brand span{color:var(--primary)}.progresswrap{flex:1;height:10px;background:#e8eef7;border-radius:999px;overflow:hidden}.progressbar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#53a0ff);transition:.25s}.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:82px;text-align:right}.timer.warn{color:var(--bad)}
.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:20px}
.sidebar{position:sticky;top:72px;height:calc(100vh - 92px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef2f7;border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}.seg button{border:0;border-radius:9px;padding:9px;font-weight:800;background:transparent;color:#53657b;cursor:pointer}.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(20,32,51,.12)}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.side-title{font-weight:900;margin:14px 0 10px}.search,.select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}.search{margin-top:10px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.checkrow{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:650;margin-top:4px;cursor:pointer}.checkrow input{accent-color:var(--primary)}
.btn{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:750;background:#eaf1fb;color:#17406f}.btn.primary{background:var(--primary);color:#fff}.btn.danger{background:#fff1f0;color:var(--bad)}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.active{background:#dbeafe;color:#0b4db3;border-color:#9fbceb}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.navbtn{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:800;color:#516174;position:relative;font-size:12px;padding:0}.navbtn.answered{background:#eaf2ff;border-color:#8db8ff;color:#174f9e}.navbtn.correct{background:#e8f7ef;border-color:#7ad1a7;color:var(--ok)}.navbtn.wrong{background:#fff0ee;border-color:#f3a49d;color:var(--bad)}.navbtn.flagged:after{content:"★";position:absolute;right:1px;top:-5px;color:#d97706;font-size:10px}
.stats{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,#0f4fbf,#2078e8);color:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.94}
.sessgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px;margin-bottom:16px}
.sesscard{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(20,32,51,.05);color:var(--text)}.sesscard:hover{border-color:#9fbceb}.sesscard.on{border-color:var(--primary);box-shadow:0 0 0 2px #cfe0fb}
.sesscard .k{font-size:12px;font-weight:850;color:var(--primary);text-transform:uppercase;letter-spacing:.04em}.sesscard .t{font-weight:750;font-size:14px;line-height:1.3;margin:3px 0 9px;min-height:36px}.sesscard .m{font-size:12px;color:var(--muted);margin-top:6px}
.mini-bar{height:8px;background:#e8eef7;border-radius:999px;overflow:hidden;display:block}.mini-fill{height:100%;background:var(--primary);display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
.summary{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.summary h2{margin-top:0}
details.sumd{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fbfdff}details.sumd>summary{cursor:pointer;padding:12px 15px;font-weight:800;color:#124b99}details.sumd .summary-grid{padding:0 12px 12px}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sum-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.sum-card h3{margin:0 0 8px;color:#124b99;font-size:16px}.sum-card ul{margin:0;padding-left:19px}.sum-card li{margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13px;background:#fff}.chip input{accent-color:var(--primary)}
.setup-row{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin-top:16px}.setup-row .select{width:auto;min-width:170px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:16px;scroll-margin-top:80px}
.qhead{display:flex;gap:12px}.qnum{flex:none;width:42px;height:42px;border-radius:13px;background:#eaf2ff;color:var(--primary);display:grid;place-items:center;font-weight:900}.qtitle{font-size:17px;font-weight:780}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{border-radius:999px;padding:3px 9px;background:#eef2f7;color:#53657b;font-size:12px;font-weight:750}.tag.sess{background:#eaf2ff;color:#174f9e}
.options{display:grid;gap:9px;margin-top:18px}.option{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;background:#fff}.option:hover{border-color:#9fbceb;background:#f8fbff}.option input{margin-top:4px;accent-color:var(--primary);transform:scale(1.08)}.option.selected{border-color:var(--primary);background:#f1f6ff}.option.correct{border-color:#62c798;background:#edf9f3}.option.wrong{border-color:#ef8f86;background:#fff2f0}.letter{font-weight:900;color:#41536a;min-width:20px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.feedback{margin-top:15px;padding:14px;border-radius:13px;border-left:5px solid}.feedback.ok{background:#ecf9f2;border-color:var(--ok)}.feedback.bad{background:#fff1ef;border-color:var(--bad)}.feedback.info{background:#fff7e8;border-color:var(--warn)}.explain{margin-top:8px;color:#3f5065}.memory{margin-top:9px;padding:9px 11px;border-radius:9px;background:#f4f7fb;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.footerbar{position:sticky;bottom:0;z-index:15;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 -10px 30px rgba(20,32,51,.08);border-radius:15px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal{position:fixed;inset:0;background:rgba(7,18,38,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:26px}
.scorecircle{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:16px auto;background:#e9eef6}.scoreinner{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:24px;line-height:1.2}
.summarygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summarybox{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
.topic-row{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hidden{display:none!important}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted)}
@media(max-width:940px){.layout{grid-template-columns:1fr;padding:12px}.sidebar{position:relative;top:auto;height:auto;max-height:480px}.navgrid{grid-template-columns:repeat(10,1fr)}.summary-grid{grid-template-columns:1fr}}
@media(max-width:600px){.navgrid{grid-template-columns:repeat(7,1fr)}.card{padding:16px}.summarygrid{grid-template-columns:1fr}.footerbar{align-items:stretch;flex-direction:column}.topic-row{grid-template-columns:1fr 1fr 50px}.brand span{display:none}.hero h1{font-size:21px}}
@media print{.top,.sidebar,.toolbar,.footerbar,.qactions,.sessgrid{display:none!important}.layout{display:block;padding:0}.card{box-shadow:none;break-inside:avoid}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">GenAI <span>Câu hỏi ôn thi Module 3</span></div><div class="progresswrap"><div class="progressbar" id="progressbar"></div></div><div class="timer" id="timer">00:00:00</div></div></header>
<div class="layout">
<aside class="sidebar">
 <div class="seg"><button data-mode="practice">Ôn tập</button><button data-mode="exam">Thi thử</button></div>
 <div id="practiceCtl">
  <label class="lbl" for="sessSelect">Buổi</label><select id="sessSelect" class="select"></select>
  <label class="lbl" for="topicSelect">Chủ đề</label><select id="topicSelect" class="select"></select>
  <input id="search" class="search" placeholder="Tìm câu hỏi, khái niệm, công thức...">
  <div class="filters"><button class="btn ghost active" data-filter="all">Tất cả</button><button class="btn ghost" data-filter="unanswered">Chưa trả lời</button><button class="btn ghost" data-filter="wrong">Câu sai</button><button class="btn ghost" data-filter="flagged">Đánh dấu</button><button class="btn ghost" data-filter="multi">Chọn nhiều</button><button class="btn ghost" data-filter="unchecked">Chưa kiểm tra</button></div>
  <label class="checkrow"><input type="checkbox" id="shuffleOpts"> Trộn thứ tự đáp án A/B/C/D</label>
 </div>
 <div class="side-title">Điều hướng <span id="navCount" style="color:var(--muted);font-weight:700"></span></div>
 <div class="navgrid" id="navgrid"></div>
 <div class="stats" id="stats"></div>
</aside>
<main>
 <section class="hero"><h1 id="heroTitle"></h1><p id="heroSub"></p></section>
 <div id="practiceTop"><div class="sessgrid" id="sessGrid"></div><section class="summary" id="summary"></section></div>
 <section class="summary hidden" id="examSetup">
  <h2>Tạo đề thi thử</h2>
  <p style="margin-top:-6px;color:var(--muted)">Câu hỏi được rút ngẫu nhiên, chia đều theo các buổi đã chọn; thứ tự đáp án được trộn. Không xem đáp án cho tới khi nộp bài.</p>
  <div class="lbl">Chọn buổi</div><div class="chips" id="examChips"></div>
  <div class="setup-row">
   <div><label class="lbl" for="examCount">Số câu</label><select id="examCount" class="select"><option>10</option><option selected>20</option><option value="999">Tất cả câu của các buổi đã chọn</option></select></div>
   <div><label class="lbl" for="examTime">Thời gian</label><select id="examTime" class="select"><option value="60" selected>1 phút / câu</option><option value="45">45 giây / câu</option><option value="90">1,5 phút / câu</option><option value="0">Không giới hạn</option></select></div>
   <button class="btn primary" id="startExam">Bắt đầu thi</button>
  </div>
 </section>
 <div class="toolbar" id="toolbar"></div>
 <div id="questionList"></div>
 <div class="footerbar" id="footer"><div id="liveResult"></div><button class="btn primary" id="submitBottom"></button></div>
</main></div>
<div class="modal" id="resultModal"><div class="modalbox"><h2 style="text-align:center;margin:0" id="resultTitle">Kết quả bài làm</h2><div class="scorecircle" id="scorecircle"><div class="scoreinner" id="scoreinner"></div></div><div class="summarygrid"><div class="summarybox"><b id="correctCount">0</b><br>Đúng</div><div class="summarybox"><b id="wrongCount">0</b><br>Sai</div><div class="summarybox"><b id="blankCount">0</b><br>Chưa trả lời</div></div><p id="resultMessage" style="text-align:center"></p><div id="topicResults"></div><div style="text-align:center;margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="reviewWrong">Xem lại câu sai</button><button class="btn primary" id="closeModal">Xem lại bài</button></div></div></div>
<script>
const DATA=[{"b": 1, "title": "Tổng quan GenAI/LLM và lựa chọn công cụ", "sub": "LLM, context, xác suất token, chọn rule/LLM/RAG/Agent, kiểm soát rủi ro", "summary": "<div class=\"sum-card\"><h3>1. Chọn đúng công cụ<\/h3><ul><li>Logic rõ ràng, ít thay đổi, mô tả được bằng điều kiện → rule/validation; không cần LLM.<\/li><li>Cần trả lời dựa trên tài liệu nội bộ hay cập nhật → RAG: truy xuất tài liệu liên quan rồi đưa bằng chứng vào context.<\/li><li>Cần nhiều bước, gọi nhiều tool → Agent; xử lý ảnh/video → Computer Vision.<\/li><li>Chọn công cụ theo bài toán, không theo độ “mới” của công nghệ.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Bản chất và giới hạn của LLM<\/h3><ul><li>LLM sinh token tiếp theo theo xác suất; xác suất cao ≠ sự thật, câu trả lời trôi chảy vẫn có thể sai (hallucination).<\/li><li>Context window có giới hạn; prompt dài làm tăng độ trễ và chi phí → chỉ đưa thông tin thực sự cần.<\/li><li>Việc có rủi ro cao (thay đổi cấu hình, ảnh hưởng dịch vụ) cần con người phê duyệt trước khi thực hiện.<\/li><li>Mẫu an toàn: RAG lấy bằng chứng → LLM đề xuất → người duyệt → mới hành động.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Một hệ thống chỉ cần kiểm tra mã ticket có đúng định dạng cố định hay không; logic kiểm tra rõ ràng, ít thay đổi và có thể mô tả bằng các điều kiện cụ thể. Cách tiếp cận phù hợp nhất là gì?", "options": [{"text": "Dùng rule/validation để kiểm tra theo các điều kiện đã xác định"}, {"text": "Dùng mô hình ngôn ngữ lớn (Large Language Model - LLM) để sinh kết quả"}, {"text": "Dùng Computer Vision (CV - thị giác máy tính) để nhận diện mã ticket"}, {"text": "Dùng Agent để gọi nhiều công cụ theo quy trình"}], "answer": [0], "multi": false, "topic": "Chọn công cụ", "explanation": "Logic cố định, rõ ràng và mô tả được bằng điều kiện thì dùng rule/validation: nhanh, rẻ, chính xác và kiểm thử được. Dùng LLM, CV hay Agent ở đây là thừa và kém ổn định hơn.", "memory": "Bài toán có luật rõ ràng → rule trước, AI sau."}, {"n": 2, "text": "Một hệ thống cần trả lời câu hỏi dựa trên sổ tay vận hành nội bộ thường xuyên được cập nhật và cần đưa phần tài liệu liên quan vào ngữ cảnh trước khi tạo câu trả lời. Giải pháp phù hợp nhất là gì?", "options": [{"text": "Chỉ dùng mô hình ngôn ngữ lớn (Large Language Model - LLM) dựa vào kiến thức đã học trước"}, {"text": "Dùng Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất) để tìm tài liệu liên quan rồi đưa bằng chứng vào ngữ cảnh cho LLM"}, {"text": "Chỉ dùng rule cố định cho mọi câu hỏi"}, {"text": "Dùng Computer Vision (CV - thị giác máy tính) để xử lý tài liệu"}], "answer": [1], "multi": false, "topic": "Chọn công cụ", "explanation": "Tài liệu nội bộ thường xuyên cập nhật nên không nằm trong kiến thức đã học của LLM. RAG truy xuất phần tài liệu liên quan và đưa vào context làm bằng chứng cho câu trả lời.", "memory": ""}, {"n": 3, "text": "Khi thiết kế ứng dụng dùng mô hình ngôn ngữ lớn (Large Language Model - LLM), vì sao việc đưa toàn bộ dữ liệu vào prompt cho mọi lần gọi không phải là chiến lược có thể mở rộng vô hạn?", "options": [{"text": "Vì LLM chỉ xử lý được dữ liệu dạng số"}, {"text": "Vì prompt dài luôn làm mô hình trả lời sai"}, {"text": "Vì context có giới hạn, đầu vào dài có thể làm tăng độ trễ và chi phí, nên cần chọn thông tin thực sự cần thiết"}, {"text": "Vì LLM không thể xử lý nhiều hơn một câu trong mỗi lần gọi"}], "answer": [2], "multi": false, "topic": "Giới hạn của LLM", "explanation": "Context window có giới hạn; đầu vào dài làm tăng độ trễ và chi phí. Vì vậy cần chọn lọc thông tin cần thiết (ví dụ qua retrieval) thay vì nhồi toàn bộ dữ liệu.", "memory": ""}, {"n": 4, "text": "Một mô hình ngôn ngữ lớn (Large Language Model - LLM) tạo ra một câu trả lời rất trôi chảy và token tiếp theo được chọn vì có xác suất cao theo mô hình. Kết luận nào phù hợp nhất?", "options": [{"text": "Câu trả lời chắc chắn đúng vì token có xác suất cao"}, {"text": "Câu trả lời vẫn có thể sai hoặc thiếu bằng chứng vì xác suất cao không đồng nghĩa với sự thật"}, {"text": "Câu trả lời chỉ có thể sai khi context hoàn toàn trống"}, {"text": "Mô hình tự động kiểm chứng mọi mệnh đề trước khi sinh câu trả lời"}], "answer": [1], "multi": false, "topic": "Giới hạn của LLM", "explanation": "LLM chọn token theo xác suất, không kiểm chứng sự thật. Câu trả lời trôi chảy vẫn có thể sai hoặc thiếu bằng chứng (hallucination).", "memory": "Xác suất cao ≠ đúng sự thật."}, {"n": 5, "text": "Một hệ thống hỗ trợ xử lý sự cố mạng phải dùng tài liệu vận hành nội bộ hiện hành để đề xuất bước xử lý tiếp theo. Một đề xuất sai có thể dẫn đến thay đổi cấu hình và gây gián đoạn dịch vụ. Quy trình nào phù hợp nhất với nguyên tắc lựa chọn công cụ và kiểm soát rủi ro?", "options": [{"text": "Cho mô hình ngôn ngữ lớn (Large Language Model - LLM) tự tạo đề xuất từ kiến thức có sẵn và tự động thay đổi cấu hình ngay"}, {"text": "Đưa toàn bộ kho tài liệu vào mọi prompt, sau đó cho LLM tự động thực hiện hành động nếu câu trả lời có vẻ hợp lý"}, {"text": "Dùng Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất) để đưa tài liệu liên quan vào context, dùng LLM tạo đề xuất và yêu cầu con người phê duyệt trước khi thực hiện hành động có rủi ro cao"}, {"text": "Chỉ tăng độ dài đầu ra của LLM để giảm khả năng sai"}], "answer": [2], "multi": false, "topic": "Kiểm soát rủi ro", "explanation": "RAG đưa tài liệu hiện hành vào context, LLM tạo đề xuất, và hành động rủi ro cao (thay đổi cấu hình) phải được con người phê duyệt. Tự động thay đổi ngay hoặc nhồi toàn bộ kho tài liệu đều không an toàn.", "memory": ""}]}, {"b": 2, "title": "Prompt Engineering và gọi LLM API", "sub": "Cấu trúc prompt, few-shot, structured output, bảo mật API key, prompt injection", "summary": "<div class=\"sum-card\"><h3>1. Thiết kế prompt<\/h3><ul><li>Cấu trúc đầy đủ: Role – Task – Context – Constraints – Output.<\/li><li>Zero-shot: chỉ mô tả nhiệm vụ; few-shot: kèm vài ví dụ input–output đúng, giúp ổn định nhãn đặc thù.<\/li><li>Yêu cầu output có cấu trúc (JSON) để dễ kiểm thử và tích hợp hệ thống.<\/li><li>Temperature cao làm kết quả đa dạng hơn, không làm kết quả đúng hơn.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Tích hợp an toàn vào hệ thống<\/h3><ul><li>Dù LLM đã trả JSON vẫn phải kiểm tra parse được, đúng schema và giá trị nằm trong tập cho phép.<\/li><li>API key/token lấy từ environment variable hoặc secret manager; không ghi vào code, log hay prompt.<\/li><li>Prompt injection: tách dữ liệu người dùng khỏi instruction, coi nội dung người dùng là dữ liệu.<\/li><li>Cho phép nhãn needs_review khi thiếu bằng chứng; validate output và kiểm thử bằng test set.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Khi thiết kế prompt để kết quả có thể kiểm thử và tích hợp vào hệ thống, cấu trúc nào mô tả đầy đủ nhất các thành phần chính của một prompt?", "options": [{"text": "Role – Data – Model – Temperature – Evaluation"}, {"text": "Role – Task – Context – Constraints – Output"}, {"text": "Input – Training – Prediction – Metric – Output"}, {"text": "System – Model – Token – Sampling – Response"}], "answer": [1], "multi": false, "topic": "Thiết kế prompt", "explanation": "Prompt đầy đủ gồm Role (vai trò) – Task (nhiệm vụ) – Context (ngữ cảnh) – Constraints (ràng buộc) – Output (định dạng đầu ra). Các phương án khác lẫn tham số model hoặc quy trình ML vào cấu trúc prompt.", "memory": ""}, {"n": 2, "text": "Một tác vụ phân loại có các nhãn nghiệp vụ đặc thù và mô hình thường gán nhãn chưa ổn định. Cách prompting nào phù hợp hơn để mô hình học cách gán nhãn mong muốn?", "options": [{"text": "Dùng zero-shot và chỉ mô tả ngắn tên các nhãn"}, {"text": "Dùng few-shot với một số ví dụ đầu vào–đầu ra đúng"}, {"text": "Tăng temperature để mô hình thử nhiều nhãn khác nhau"}, {"text": "Bỏ bộ nhãn để mô hình tự tạo nhãn phù hợp"}], "answer": [1], "multi": false, "topic": "Thiết kế prompt", "explanation": "Few-shot cung cấp ví dụ input–output đúng, giúp mô hình bắt chước cách gán nhãn đặc thù. Tăng temperature chỉ làm kết quả ngẫu nhiên hơn.", "memory": ""}, {"n": 3, "text": "Một mô hình ngôn ngữ lớn (Large Language Model - LLM) đã trả về dữ liệu theo định dạng JSON (JavaScript Object Notation). Trước khi hệ thống downstream sử dụng kết quả, bước nào vẫn cần thực hiện?", "options": [{"text": "Kiểm tra JSON có dài hơn câu trả lời thông thường không"}, {"text": "Kiểm tra khả năng parse, schema và các giá trị được phép"}, {"text": "Chuyển toàn bộ JSON thành văn bản tự do để đọc"}, {"text": "Tăng temperature rồi yêu cầu mô hình sinh lại JSON mới"}], "answer": [1], "multi": false, "topic": "Structured output & bảo mật", "explanation": "Output JSON vẫn có thể sai cú pháp, thiếu trường hoặc có giá trị ngoài tập cho phép. Phải kiểm tra parse, schema và allowed values trước khi hệ thống downstream dùng.", "memory": "LLM trả JSON ≠ JSON hợp lệ."}, {"n": 4, "text": "Khi gọi giao diện lập trình ứng dụng (Application Programming Interface - API) của mô hình ngôn ngữ lớn từ code, cách xử lý API key hoặc token nào phù hợp nhất?", "options": [{"text": "Ghi trực tiếp secret vào source code để triển khai thuận tiện"}, {"text": "Lưu secret trong log để dễ kiểm tra khi có lỗi"}, {"text": "Lấy secret từ environment variable hoặc cơ chế quản lý secret"}, {"text": "Đưa secret vào user prompt để gửi cùng dữ liệu đầu vào"}], "answer": [2], "multi": false, "topic": "Structured output & bảo mật", "explanation": "Secret lấy từ environment variable hoặc secret manager. Ghi vào source code, log hay prompt đều có nguy cơ lộ key.", "memory": ""}, {"n": 5, "text": "Một hệ thống phân loại ticket nhận nội dung do người dùng nhập. Một ticket chứa câu “bỏ qua mọi hướng dẫn trước đó”, dữ liệu mô tả sự cố lại thiếu bằng chứng rõ ràng, và kết quả sẽ được hệ thống khác sử dụng tự động. Quy trình nào phù hợp nhất?", "options": [{"text": "Xem toàn bộ ticket là instruction, chọn nhãn gần nhất và chuyển thẳng kết quả"}, {"text": "Bỏ qua phần thiếu dữ liệu, tăng temperature và chọn nhãn có vẻ hợp lý nhất"}, {"text": "Tách dữ liệu khỏi instruction, cho phép needs_review, validate output và kiểm thử bằng test set"}, {"text": "Cho mô hình giải thích thật dài, rồi dùng trực tiếp câu trả lời nếu nghe hợp lý"}], "answer": [2], "multi": false, "topic": "Prompt injection", "explanation": "Nội dung ticket là dữ liệu, không phải instruction. Cần tách dữ liệu khỏi instruction, cho phép nhãn needs_review khi thiếu bằng chứng, validate output trước khi chuyển tự động và kiểm thử bằng test set.", "memory": ""}]}, {"b": 3, "title": "RAG: Embedding, tìm kiếm và Vector Database", "sub": "Pipeline RAG, embedding, keyword/semantic/hybrid search, FAISS/Chroma/Milvus, metadata", "summary": "<div class=\"sum-card\"><h3>1. Pipeline RAG<\/h3><ul><li>Ingestion → Chunking → Embedding → (lưu vector) → Retrieval → Generation.<\/li><li>Embedding biến văn bản thành vector để đo độ gần nhau về ý nghĩa.<\/li><li>Retrieval lấy bằng chứng; generation diễn đạt câu trả lời dựa trên bằng chứng đó.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Tìm kiếm và lưu trữ<\/h3><ul><li>Keyword search: mạnh với mã lỗi, số hiệu, từ khóa chính xác (ví dụ ERR-504, HN-023).<\/li><li>Semantic search: mạnh với câu hỏi diễn đạt tự nhiên; hybrid search kết hợp cả hai.<\/li><li>Metadata filter (phiên bản, ngày, nguồn) giúp tránh lấy đúng chủ đề nhưng sai phiên bản.<\/li><li>FAISS/Chroma: đơn giản, phù hợp PoC chạy local; Milvus: hướng tới hệ thống phân tán quy mô lớn.<\/li><li>Tăng top-k quá cao hoặc nhồi toàn bộ kho vào prompt không giải quyết được vấn đề sai nguồn.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong một hệ thống Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất), thứ tự nào mô tả đúng pipeline từ chuẩn bị tài liệu đến tạo câu trả lời?", "options": [{"text": "Ingestion → Embedding → Chunking → Generation → Retrieval"}, {"text": "Ingestion → Chunking → Embedding → Retrieval → Generation"}, {"text": "Chunking → Ingestion → Retrieval → Embedding → Generation"}, {"text": "Embedding → Retrieval → Ingestion → Chunking → Generation"}], "answer": [1], "multi": false, "topic": "Pipeline RAG", "explanation": "Thứ tự đúng: Ingestion (nạp tài liệu) → Chunking (chia đoạn) → Embedding (vector hóa) → Retrieval (tìm đoạn liên quan) → Generation (sinh câu trả lời).", "memory": ""}, {"n": 2, "text": "Embedding trong hệ thống tìm kiếm tài liệu được sử dụng chủ yếu với mục đích nào?", "options": [{"text": "Biến văn bản thành từ khóa để tìm chính xác từng chuỗi ký tự"}, {"text": "Biến văn bản thành vector để đo mức độ gần nhau về ý nghĩa"}, {"text": "Biến tài liệu thành nhãn để thay thế hoàn toàn bước retrieval"}, {"text": "Biến câu hỏi thành câu trả lời mà không cần tìm tài liệu"}], "answer": [1], "multi": false, "topic": "Embedding & tìm kiếm", "explanation": "Embedding biến văn bản thành vector, nhờ đó đo được mức độ gần nhau về ý nghĩa giữa câu hỏi và các đoạn tài liệu.", "memory": ""}, {"n": 3, "text": "Một người dùng cần tìm chính xác mã lỗi “ERR-504” và site “HN-023” trong kho tài liệu. Cách tìm kiếm nào phù hợp nhất cho nhu cầu này?", "options": [{"text": "Keyword search vì phù hợp với mã, số hiệu và từ khóa cụ thể"}, {"text": "Semantic search vì luôn chính xác hơn khi tìm mã thiết bị cụ thể"}, {"text": "Vector search vì không cần quan tâm chuỗi ký tự trong truy vấn"}, {"text": "Generation vì mô hình có thể tự suy ra mã từ ngữ cảnh"}], "answer": [0], "multi": false, "topic": "Embedding & tìm kiếm", "explanation": "Mã lỗi, mã site là chuỗi ký tự chính xác nên keyword search phù hợp. Semantic search có thể trả về các mã “na ná” nhưng sai.", "memory": "Mã/số hiệu → keyword; diễn đạt tự nhiên → semantic; trộn cả hai → hybrid."}, {"n": 4, "text": "Một nhóm đang xây Proof of Concept (PoC - thử nghiệm khái niệm) RAG trên tập dữ liệu nhỏ, muốn chạy local và chưa cần hệ thống phân tán quy mô lớn. Lựa chọn nào phù hợp nhất?", "options": [{"text": "Milvus vì được thiết kế chủ yếu cho hệ thống phân tán quy mô lớn"}, {"text": "FAISS hoặc Chroma vì phù hợp PoC và có thể triển khai đơn giản"}, {"text": "Milvus vì luôn đơn giản hơn khi thử nghiệm trên tập dữ liệu nhỏ"}, {"text": "Fine-tuning vì có thể thay thế hoàn toàn nhu cầu dùng vector database"}], "answer": [1], "multi": false, "topic": "Vector database", "explanation": "FAISS hoặc Chroma đơn giản, chạy local được, phù hợp PoC dữ liệu nhỏ. Milvus hướng tới hệ thống phân tán quy mô lớn; fine-tuning không thay thế vector database.", "memory": ""}, {"n": 5, "text": "Một hệ thống RAG cần trả lời câu hỏi về quy trình phiên bản 2024. Người dùng thường nhập cả mã lỗi cụ thể lẫn mô tả tự nhiên; kho tài liệu có nhiều phiên bản, và kết quả hiện tại đôi khi lấy đúng chủ đề nhưng sai phiên bản. Cách cải thiện nào phù hợp nhất?", "options": [{"text": "Chỉ tăng top-k thật cao để lấy nhiều chunk từ mọi phiên bản tài liệu"}, {"text": "Chỉ dùng semantic search và bỏ metadata để tránh giới hạn kết quả"}, {"text": "Kết hợp keyword và semantic search, đồng thời lọc metadata theo phiên bản phù hợp"}, {"text": "Bỏ retrieval và đưa toàn bộ kho tài liệu trực tiếp vào prompt mỗi lần"}], "answer": [2], "multi": false, "topic": "Embedding & tìm kiếm", "explanation": "Người dùng nhập cả mã lỗi lẫn mô tả tự nhiên nên cần hybrid search (keyword + semantic). Lỗi sai phiên bản được xử lý bằng metadata filter theo phiên bản 2024.", "memory": ""}]}, {"b": 4, "title": "RAG: Chunking, Grounding và Đánh giá", "sub": "Chunking, grounded prompt, chẩn đoán lỗi retrieval vs generation, faithfulness", "summary": "<div class=\"sum-card\"><h3>1. Chunking và grounding<\/h3><ul><li>Fixed-size: chia theo độ dài cố định, dễ cắt ngang ý; recursive: ưu tiên ranh giới cấu trúc (heading, đoạn) trước kích thước.<\/li><li>Grounded prompt: chỉ trả lời từ context; thiếu bằng chứng thì nói “không đủ thông tin”, không suy diễn.<\/li><li>Yêu cầu citation để người dùng kiểm tra được nguồn.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Chẩn đoán và đánh giá RAG<\/h3><ul><li>Retriever lấy sai/thiếu chunk → sửa retrieval (chunking, embedding, top-k, hybrid, metadata).<\/li><li>Đã lấy đúng chunk nhưng trả lời sai/thêm thắt → lỗi generation: sửa prompt, siết grounding.<\/li><li>Faithfulness: các phát biểu trong câu trả lời có được context hỗ trợ không.<\/li><li>Answer relevance: câu trả lời có đúng trọng tâm câu hỏi; context recall/precision: retriever lấy đủ và đúng chunk.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Trong hệ thống Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất), vai trò chính của retrieval và generation là gì?", "options": [{"text": "Retrieval tạo câu trả lời, generation chọn tài liệu phù hợp"}, {"text": "Retrieval lấy bằng chứng, generation diễn đạt câu trả lời từ bằng chứng"}, {"text": "Retrieval huấn luyện mô hình, generation cập nhật kho tài liệu"}, {"text": "Retrieval tạo embedding, generation lưu vector vào cơ sở dữ liệu"}], "answer": [1], "multi": false, "topic": "Pipeline RAG", "explanation": "Retrieval tìm và lấy bằng chứng từ kho tài liệu; generation dùng LLM diễn đạt câu trả lời dựa trên bằng chứng đó.", "memory": ""}, {"n": 2, "text": "Với sổ tay vận hành có nhiều heading, mục và section rõ ràng, cách chunking nào phù hợp để giữ cấu trúc tài liệu tốt hơn?", "options": [{"text": "Fixed-size chunking vì luôn chia tài liệu theo kích thước cố định"}, {"text": "Recursive chunking vì ưu tiên chia theo cấu trúc trước kích thước"}, {"text": "Random chunking vì tạo các đoạn có độ dài khác nhau tự nhiên"}, {"text": "Single-chunk vì giữ toàn bộ tài liệu trong một đoạn duy nhất"}], "answer": [1], "multi": false, "topic": "Chunking & grounding", "explanation": "Recursive chunking ưu tiên chia theo ranh giới cấu trúc (heading, section, đoạn) trước rồi mới xét kích thước, nên giữ cấu trúc tài liệu tốt hơn fixed-size.", "memory": ""}, {"n": 3, "text": "Một grounded prompt dùng cho hệ thống Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất) nên yêu cầu mô hình làm gì khi context không có đủ bằng chứng?", "options": [{"text": "Tự bổ sung kiến thức ngoài để hoàn thành câu trả lời"}, {"text": "Suy đoán phương án hợp lý rồi ghi mức confidence thấp"}, {"text": "Trả lời không đủ thông tin thay vì tự suy diễn thêm"}, {"text": "Chọn chunk gần nghĩa nhất rồi coi đó là bằng chứng"}], "answer": [2], "multi": false, "topic": "Chunking & grounding", "explanation": "Grounded prompt yêu cầu chỉ trả lời từ context; khi thiếu bằng chứng thì nói không đủ thông tin thay vì tự suy diễn hay dùng kiến thức ngoài.", "memory": ""}, {"n": 4, "text": "Một hệ thống Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất) đã lấy được đúng các chunk chứa đầy đủ bằng chứng cần thiết. Tuy nhiên, câu trả lời cuối lại diễn giải sai nội dung và thêm một kết luận không có trong context. Cách xử lý phù hợp nhất là gì?", "options": [{"text": "Tăng top-k để đưa thêm nhiều tài liệu hơn vào context"}, {"text": "Tăng chunk size để mỗi chunk chứa nhiều nội dung hơn"}, {"text": "Kiểm tra prompt và generation, đồng thời siết grounding theo context"}, {"text": "Đổi embedding model vì retriever chưa tìm được bằng chứng đúng"}], "answer": [2], "multi": false, "topic": "Đánh giá RAG", "explanation": "Retriever đã lấy đúng và đủ bằng chứng, nên lỗi nằm ở generation. Cần kiểm tra prompt và siết grounding; tăng top-k, chunk size hay đổi embedding là sửa nhầm chỗ.", "memory": "Chẩn đoán trước: lỗi retrieval hay lỗi generation?"}, {"n": 5, "text": "Trong đánh giá Retrieval-Augmented Generation (RAG - sinh tăng cường truy xuất), faithfulness kiểm tra điều gì?", "options": [{"text": "Retriever có lấy đủ các chunk cần thiết cho câu hỏi"}, {"text": "Câu trả lời có tập trung đúng vào câu hỏi người dùng"}, {"text": "Các phát biểu trong câu trả lời có được context hỗ trợ"}, {"text": "Citation có đúng định dạng và đường dẫn tài liệu hay không"}], "answer": [2], "multi": false, "topic": "Đánh giá RAG", "explanation": "Faithfulness đo các phát biểu trong câu trả lời có được context hỗ trợ không. Lấy đủ chunk là context recall; đúng trọng tâm câu hỏi là answer relevance.", "memory": ""}]}, {"b": 5, "title": "NLP ứng dụng và Fine-tuning (LoRA/QLoRA)", "sub": "Text classification, information extraction, LoRA, QLoRA, đánh giá theo lớp", "summary": "<div class=\"sum-card\"><h3>1. Tác vụ NLP<\/h3><ul><li>Text classification: gán một hoặc nhiều nhãn đã định nghĩa cho văn bản.<\/li><li>Information extraction: trích các trường cụ thể theo schema cố định.<\/li><li>Không tìm thấy trường → trả null/unknown, không tự suy đoán, không đổi schema.<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Fine-tuning hiệu quả<\/h3><ul><li>Thứ tự cân nhắc: prompt tốt → RAG (khi thiếu tri thức) → fine-tune (khi cần thay đổi hành vi/định dạng ổn định).<\/li><li>LoRA: đóng băng trọng số gốc, chỉ huấn luyện các adapter hạng thấp nhỏ.<\/li><li>QLoRA: lượng tử hóa mô hình gốc + LoRA adapter → fine-tune được khi bộ nhớ GPU hạn chế.<\/li><li>Đánh giá trên test set riêng; lớp hiếm nhưng quan trọng thì theo dõi recall từng lớp, không chỉ accuracy chung; giữ human review cho case không chắc.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Text classification trong xử lý ngôn ngữ tự nhiên (Natural Language Processing - NLP) được dùng chủ yếu để làm gì?", "options": [{"text": "Trích các trường dữ liệu cụ thể từ một đoạn văn bản"}, {"text": "Gán một hoặc nhiều nhãn đã định nghĩa cho văn bản"}, {"text": "Sinh câu trả lời tự do dựa trên một kho tài liệu"}, {"text": "Tìm các đoạn văn bản có ý nghĩa gần với nhau"}], "answer": [1], "multi": false, "topic": "Classification & Extraction", "explanation": "Text classification gán một hoặc nhiều nhãn đã định nghĩa cho văn bản. Trích trường dữ liệu là information extraction; tìm đoạn gần nghĩa là semantic search.", "memory": ""}, {"n": 2, "text": "Khi Information Extraction (trích xuất thông tin) không tìm thấy một trường nghiệp vụ trong văn bản đầu vào, hệ thống nên xử lý thế nào?", "options": [{"text": "Tự suy đoán giá trị phù hợp nhất từ các trường còn lại"}, {"text": "Bỏ trường đó và tự thay đổi schema của output"}, {"text": "Trả null hoặc unknown xt": "Chuyển sang RAG để học hành vi phân loại và đánh giá chủ yếu bằng số ticket đúng"}, {"text": "Cân nhắc QLoRA, giữ test set riêng, theo dõi recall từng lớp và review case không chắc"}, {"text": "Full fine-tuning toàn bộ model, dùng train set để đánh giá và bỏ qua class imbalance"}], "answer": [2], "multi": false, "topic": "Fine-tuning LoRA/QLoRA", "explanation": "Prompt đã tối ưu, có dữ liệu nhãn tốt, GPU hạn chế → QLoRA hợp lý. Lớp nghiêm trọng hiếm nên theo dõi recall từng lớp trên test set riêng và review các case không chắc. RAG không dạy hành vi phân loại; đánh giá trên train set là sai.", "memory": ""}]}, {"b": 6, "title": "AI Agent: Planning, Memory, Tool Use và Control", "sub": "Chatbot vs Agent, ba trụ cột, control, least privilege, human approval", "summary": "<div class=\"sum-card\"><h3>1. Kiến trúc Agent<\/h3><ul><li>Chatbot chủ yếu trả lời; Agent điều phối nhiều bước và gọi tool để hoàn thành nhiệm vụ.<\/li><li>Ba trụ cột: Planning (lập kế hoạch các bước), Memory (ngữ cảnh ngắn/dài hạn), Tool Use (gọi API, truy vấn, tính toán).<\/li><\/ul><\/div><div class=\"sum-card\"><h3>2. Kiểm soát Agent<\/h3><ul><li>Control: quyền hạn, validation, budget, timeout, logging và human approval.<\/li><li>Least privilege: chỉ cấp quyền cần thiết; kiểm soát chặt write-action.<\/li><li>Mẫu an toàn: tool đọc dữ liệu (KPI, sổ tay) → Agent đề xuất → người duyệt → mới thực hiện thay đổi.<\/li><li>Confidence cao không thay cho phê duyệt khi hành động có rủi ro.<\/li><\/ul><\/div>", "questions": [{"n": 1, "text": "Điểm khác biệt quan trọng giữa chatbot và AI Agent trong thiết kế hệ thống là gì?", "options": [{"text": "Chatbot luôn dùng nhiều tool, còn Agent chỉ tạo câu trả lời văn bản"}, {"text": "Chatbot chủ yếu trả lời, còn Agent có thể điều phối nhiều bước và gọi tool"}, {"text": "Chatbot luôn lưu memory dài hạn, còn Agent chỉ giữ một câu hỏi"}, {"text": "Chatbot tự thực hiện hành động, còn Agent chỉ đưa ra gợi ý cho người dùng"}], "answer": [1], "multi": false, "topic": const LETTERS='ABCDEF';
const Q=[];DATA.forEach(s=>s.questions.forEach(q=>Q.push(Object.assign({},q,{b:s.b,uid:s.b+'-'+q.n}))));
const BYID=Object.fromEntries(Q.map(q=>[q.uid,q]));
const SESS=Object.fromEntries(DATA.map(s=>[s.b,s]));
const KEY='genai_module3_onthi_35_v1';
const $=id=>document.getElementById(id);
function fresh(){return{mode:'practice',shuffleOpts:true,perm:{},practice:{answers:{},checked:{},flagged:{},order:null,started:Date.now()},exam:null,reveal:false}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.practice)return Object.assign(fresh(),x)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let state=load();
const ui={sess:'all',topic:'all',filter:'all',term:'',wrongOnly:false};
let currentIds=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
const inExam=()=>state.mode==='exam'&&!!state.exam;
const examLive=()=>inExam()&&!state.exam.submitted;
const store=()=>inExam()?state.exam:state.practice;
function permFor(q){if(!inExam()&&!state.shuffleOpts)return q.options.map((_,i)=>i);let p=state.perm[q.uid];if(!p||p.length!==q.options.length){p=shuffle(q.options.map((_,i)=>i));state.perm[q.uid]=p}return p}
const sel=(st,uid)=>(st.answers[uid]||[]).map(Number);
function sameSet(a,b){const x=[...a].sort((m,n)=>m-n),y=[...b].sort((m,n)=>m-n);return x.length===y.length&&x.every((v,i)=>v===y[i])}
const answered=(st,q)=>sel(st,q.uid).length>0;
const isCorrect=(st,q)=>sameSet(sel(st,q.uid),q.answer);
function answerLabel(q){const p=permFor(q);return q.answer.map(i=>LETTERS[p.indexOf(i)]).sort().join(', ')}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}

/* ---------- danh sách câu đang xem ---------- */
function viewIds(){
 if(state.mode==='exam'){if(!state.exam)return[];let ids=state.exam.ids;if(ui.wrongOnly&&state.exam.submitted)ids=ids.filter(u=>!isCorrect(state.exam,BYID[u]));return ids}
 const st=state.practice,t=ui.term.trim().toLowerCase();
 return(st.order||Q.map(q=>q.uid)).filter(u=>{const q=BYID[u];
  if(ui.sess!=='all'&&String(q.b)!==ui.sess)return false;
  if(ui.topic!=='all'&&q.topic!==ui.topic)return false;
  if(t&&!(q.text+' '+q.options.map(o=>o.text).join(' ')+' '+q.topic+' '+q.explanation).toLowerCase().includes(t))return false;
  switch(ui.filter){case'unanswered':return!answered(st,q);case'wrong':return!!st.checked[u]&&!isCorrect(st,q);case'flagged':return!!st.flagged[u];case'multi':return q.multi;case'unchecked':return!st.checked[u]}
  return true})
}

/* ---------- thẻ câu hỏi ---------- */
function cardHTML(q,idx){
 const st=store(),p=permFor(q),s=sel(st,q.uid),chk=!!st.checked[q.uid],rev=state.reveal&&!inExam(),lock=inExam()&&state.exam.submitted;
 let ops='';
 p.forEach((i,pos)=>{const ck=s.includes(i);let cls=ck?' selected':'';
  if(chk||rev){if(q.answer.includes(i))cls+=' correct';if(chk&&ck&&!q.answer.includes(i))cls+=' wrong'}
  ops+=`<label class="option${cls}"><input type="${q.multi?'checkbox':'radio'}" name="q${q.uid}" value="${i}" ${ck?'checked':''} ${lock?'disabled':''}><span class="letter">${LETTERS[pos]}.</span><span>${esc(q.options[i].text)}</span></label>`});
 const det=`<div class="explain">${esc(q.explanation)}</div>${q.memory?`<div class="memory"><b>Cần nhớ:</b> ${esc(q.memory)}</div>`:''}`;
 let fb='';
 if(chk){const ok=isCorrect(st,q);fb=!answered(st,q)?`<div class="feedback bad"><b>Chưa trả lời – đáp án ${answerLabel(q)}.</b>${det}</div>`:ok?`<div class="feedback ok"><b>Chính xác – đáp án ${answerLabel(q)}.</b>${det}</div>`:`<div class="feedback bad"><b>Chưa chính xác – đáp án ${answerLabel(q)}.</b>${det}</div>`}
 else if(rev)fb=`<div class="feedback info"><b>Đáp án ${answerLabel(q)}.</b>${det}</div>`;
 const flagBtn=`<button class="btn ghost" data-act="flag" data-uid="${q.uid}">${st.flagged[q.uid]?'★ Bỏ đánh dấu':'☆ Đánh dấu'}</button>`;
 const actions=inExam()?flagBtn:`<button class="btn" data-act="check" data-uid="${q.uid}">Kiểm tra câu này</button>${flagBtn}`;
 return `<div class="qhead"><div class="qnum">${idx}</div><div><div class="qtitle">${esc(q.text)}</div><div class="tags"><span class="tag sess">Buổi ${q.b} · Câu ${q.n}</span><span class="tag">${q.multi?'Chọn nhiều đáp án':'Chọn một đáp án'}</span><span class="tag">${esc(q.topic)}</span></div></div></div><div class="options">${ops}</div>${lock?'':`<div class="qactions">${actions}</div>`}${fb}`;
}
function renderList(){
 currentIds=viewIds();
 const list=$('questionList');
 if(state.mode==='exam'&&!state.exam){list.innerHTML='';updateUI();return}
 list.innerHTML=currentIds.length?currentIds.map((u,i)=>`<section class="card" id="q-${u}">${cardHTML(BYID[u],i+1)}</section>`).join(''):'<div class="empty">Không có câu hỏi phù hợp với bộ lọc hiện tại.</div>';
 save();updateUI();
}
function renderCard(uid){const el=$('q-'+uid);if(el)el.innerHTML=cardHTML(BYID[uid],currentIds.indexOf(uid)+1)}

/* ---------- thanh tiến độ, điều hướng, thống kê ---------- */
function updateUI(){
 const st=store(),qs=currentIds.map(u=>BYID[u]);
 const a=qs.filter(q=>answered(st,q)).length,checked=qs.filter(q=>st.checked[q.uid]),w=checked.filter(q=>!isCorrect(st,q)).length;
 $('progressbar').style.width=(qs.length?a/qs.length*100:0)+'%';
 $('navCount').textContent=qs.length?`(${qs.length} câu)`:'';
 const nav=$('navgrid');
 nav.innerHTML=qs.map((q,i)=>{let c='navbtn';if(answered(st,q))c+=' answered';if(st.checked[q.uid])c+=isCorrect(st,q)?' correct':' wrong';if(st.flagged[q.uid])c+=' flagged';return`<button class="${c}" data-go="${q.uid}" title="Buổi ${q.b} · Câu ${q.n}">${i+1}</button>`}).join('');
 const footer=$('footer'),btn=$('submitBottom');
 if(state.mode==='exam'){
  if(!state.exam){footer.classList.add('hidden');$('stats').innerHTML='Chưa có đề. Chọn buổi, số câu và bấm <b>Bắt đầu thi</b>.';return}
  footer.classList.remove('hidden');
  const ex=state.exam,tot=ex.ids.length,ea=ex.ids.filter(u=>answered(ex,BYID[u])).length;
  $('liveResult').innerHTML=ex.submitted?`<b>Đã nộp bài: ${ex.ids.filter(u=>isCorrect(ex,BYID[u])).length}/${tot} câu đúng</b>`:`<b>Đã trả lời ${ea}/${tot} câu</b>`;
  btn.textContent=ex.submitted?'Xem kết quả':'Nộp bài';
  $('stats').innerHTML=`Đề gồm <b>${tot}</b> câu từ buổi ${ex.sessions.join(', ')}<br>Đã trả lời: <b>${ea}</b><br>Đánh dấu: <b>${ex.ids.filter(u=>ex.flagged[u]).length}</b>`;
 }else{
  footer.classList.remove('hidden');
  $('liveResult').innerHTML=`<b>Đã trả lời ${a}/${qs.length} câu đang xem</b>`;
  btn.textContent=`Chấm điểm ${qs.length} câu đang xem`;
  const pa=Q.filter(q=>answered(st,q)).length,pc=Q.filter(q=>st.checked[q.uid]&&isCorrect(st,q)).length;
  $('stats').innerHTML=`Đang xem: <b>${qs.length}</b> câu · đã trả lời <b>${a}</b> · sai <b>${w}</b><br>Toàn bộ đề: đã trả lời <b>${pa}/${Q.length}</b> · đúng (đã kiểm tra) <b>${pc}</b>`;
  renderSessGrid();
 }
}
function renderSessGrid(){
 const st=state.practice;
 const card=(key,label,title,qs)=>{const a=qs.filter(q=>answered(st,q)).length,ck=qs.filter(q=>st.checked[q.uid]),c=ck.filter(q=>isCorrect(st,q)).length;
  return`<button class="sesscard${ui.sess===key?' on':''}" data-sess="${key}"><div class="k">${label}</div><div class="t">${esc(title)}</div><span class="mini-bar"><span class="mini-fill" style="width:${a/qs.length*100}%"></span></span><div class="m">Đã làm ${a}/${qs.length}${ck.length?` · đúng ${c}/${ck.length}`:''}</div></button>`};
 $('sessGrid').innerHTML=card('all','Tất cả','Toàn bộ '+DATA.length+' buổi',Q)+DATA.map(s=>card(String(s.b),'Buổi '+s.b,s.title,Q.filter(q=>q.b===s.b))).join('');
}

/* ---------- phần tóm tắt & điều khiển ---------- */
function renderSummary(){
 const one=s=>`<details class="sumd"${ui.sess!=='all'?' open':''}><summary>Buổi ${s.b} – ${esc(s.title)}</summary><div class="summary-grid">${s.summary}</div></details>`;
 $('summary').innerHTML=`<h2>Nội dung cần nhớ</h2>`+(ui.sess==='all'?DATA.map(one).join(''):one(SESS[+ui.sess]));
}
function fillSelects(){
 $('sessSelect').innerHTML=`<option value="all">Tất cả ${DATA.length} buổi (${Q.length} câu)</option>`+DATA.map(s=>`<option value="${s.b}">Buổi ${s.b} – ${esc(s.title)}</option>`).join('');
 $('sessSelect').value=ui.sess;
 const src=ui.sess==='all'?DATA:[SESS[+ui.sess]];
 let opts='<option value="all">Tất cả chủ đề</option>';
 src.forEach(s=>{[...new Set(s.questions.map(q=>q.topic))].forEach(t=>{opts+=`<option value="${esc(t)}">${ui.sess==='all'?'B'+s.b+' · ':''}${esc(t)}</option>`})});
 $('topicSelect').innerHTML=opts;$('topicSelect').value=ui.topic;
}
function renderToolbar(){
 const tb=$('toolbar');
 if(state.mode==='practice'){
  tb.innerHTML=`<button class="btn primary" data-tb="grade">Chấm phần đang xem</button><button class="btn" data-tb="reveal">${state.reveal?'Ẩn đáp án':'Hiện đáp án'}</button><button class="btn" data-tb="shuffle">Trộn thứ tự câu</button><button class="btn ghost" data-tb="orig">Thứ tự gốc</button><button class="btn danger" data-tb="reset">Làm lại phần đang xem</button>`;
 }else if(state.exam){
  tb.innerHTML=state.exam.submitted?`<button class="btn primary" data-tb="result">Xem kết quả</button><button class="btn ${ui.wrongOnly?'active':''}" data-tb="wrongOnly">${ui.wrongOnly?'Hiện tất cả câu':'Chỉ xem câu sai'}</button><button class="btn" data-tb="newExam">Làm đề mới</button>`:`<button class="btn primary" data-tb="submit">Nộp bài</button><button class="btn danger" data-tb="cancel">Hủy đề</button>`;
 }else tb.innerHTML='';
}
function renderAll(){
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));
 const pr=state.mode==='practice';
 $('practiceCtl').classList.toggle('hidden',!pr);$('practiceTop').classList.toggle('hidden',!pr);
 $('examSetup').classList.toggle('hidden',pr||!!state.exam);
 if(pr){
  if(ui.sess==='all'){$('heroTitle').textContent='Câu hỏi ôn thi Module 3 – GenAI, RAG, Agent & CV';$('heroSub').textContent=`${Q.length} câu trắc nghiệm, ${DATA.length} nhóm chủ đề • Mỗi câu có đáp án và giải thích • Lọc theo buổi/chủ đề • Trộn đáp án • Thi thử có đồng hồ • Lưu tiến độ, hoạt động offline. Đề gốc không kèm đáp án; đáp án và giải thích được biên soạn theo kiến thức chuẩn của chủ đề.`}
  else{const s=SESS[+ui.sess];$('heroTitle').textContent=`Buổi ${s.b} – ${s.title}`;$('heroSub').textContent=`${s.sub} • ${s.questions.length} câu trắc nghiệm`}
  fillSelects();renderSummary();
 }else{$('heroTitle').textContent='Thi thử tổng hợp';$('heroSub').textContent=state.exam?`${state.exam.ids.length} câu ngẫu nhiên từ buổi ${state.exam.sessions.join(', ')}${state.exam.submitted?' • Đã nộp bài':''}`:'Rút ngẫu nhiên câu hỏi từ các buổi bạn chọn, có đồng hồ đếm ngược và chấm điểm theo từng buổi.'}
 $('shuffleOpts').checked=state.shuffleOpts;
 renderToolbar();renderList();tick();
}

/* ---------- chấm điểm ---------- */
function showResult(ids,st,title){
 const qs=ids.map(u=>BYID[u]),c=qs.filter(q=>isCorrect(st,q)).length,b=qs.filter(q=>!answered(st,q)).length,w=qs.length-c-b,p=qs.length?Math.round(c/qs.length*100):0;
 $('resultTitle').textContent=title;
 $('correctCount').textContent=c;$('wrongCount').textContent=w;$('blankCount').textContent=b;
 $('scoreinner').innerHTML=`${p}%<br><small style="font-size:12px;font-weight:600">${c}/${qs.length}</small>`;
 $('scorecircle').style.background=`conic-gradient(var(--primary) ${p*3.6}deg,#e9eef6 0deg)`;
 $('resultMessage').textContent=p>=80?'Nắm khá chắc. Dùng "Xem lại câu sai" để ôn điểm yếu.':p>=60?'Đã nắm phần lớn nội dung; nên ôn lại các buổi/chủ đề có tỷ lệ thấp.':'Nên đọc lại phần Nội dung cần nhớ rồi làm lại theo từng buổi.';
 const multiSess=new Set(qs.map(q=>q.b)).size>1;
 const groups=new Map();[...qs].sort((x,y)=>x.b-y.b).forEach(q=>{const k=multiSess?'Buổi '+q.b+' – '+SESS[q.b].title:q.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(q)});
 let s=`<h3>Kết quả theo ${multiSess?'buổi':'chủ đề'}</h3>`;
 groups.forEach((g,k)=>{const cc=g.filter(q=>isCorrect(st,q)).length,pp=Math.round(cc/g.length*100);s+=`<div class="topic-row"><span>${esc(k)}</span><span class="mini-bar"><span class="mini-fill" style="width:${pp}%;background:${pp>=80?'var(--ok)':pp>=60?'var(--primary)':'var(--bad)'}"></span></span><b>${cc}/${g.length}</b></div>`});
 $('topicResults').innerHTML=s;$('resultModal').classList.add('show');
}
function gradePractice(){const st=state.practice;if(!currentIds.length)return;currentIds.forEach(u=>st.checked[u]=true);const ids=[...currentIds];renderList();showResult(ids,st,'Kết quả phần đang xem')}
function submitExam(auto){const ex=state.exam;if(!ex||ex.submitted)return;
 if(!auto){const left=ex.ids.filter(u=>!answered(ex,BYID[u])).length;if(left&&!confirm(`Còn ${left} câu chưa trả lời. Nộp bài?`))return}
 ex.ids.forEach(u=>ex.checked[u]=true);ex.submitted=true;ex.ended=Date.now();save();renderAll();showResult(ex.ids,ex,auto?'Hết giờ – kết quả bài thi':'Kết quả bài thi')}
function startExam(){
 const bs=[...document.querySelectorAll('#examChips input:checked')].map(x=>+x.value);
 if(!bs.length){alert('Hãy chọn ít nhất một buổi.');return}
 const n=+$('examCount').value,per=+$('examTime').value;
 const pools=bs.map(b=>shuffle(Q.filter(q=>q.b===b).map(q=>q.uid)));
 let ids=[],i=0;while(ids.length<n&&pools.some(p=>p.length)){const p=pools[i%pools.length];if(p.length)ids.push(p.pop());i++}
 ids=shuffle(ids);ids.forEach(u=>{state.perm[u]=shuffle(BYID[u].options.map((_,k)=>k))});
 state.exam={ids,answers:{},checked:{},flagged:{},sessions:bs,started:Date.now(),duration:per?ids.length*per:0,submitted:false};
 ui.wrongOnly=false;save();renderAll();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- sự kiện ---------- */
$('questionList').addEventListener('change',e=>{const inp=e.target;if(!inp.matches('.option input'))return;
 const uid=inp.name.slice(1),q=BYID[uid],st=store();if(inExam()&&state.exam.submitted)return;
 st.answers[uid]=q.multi?[...document.querySelectorAll(`input[name="q${uid}"]:checked`)].map(x=>+x.value):[+inp.value];
 delete st.checked[uid];save();renderCard(uid);updateUI()});
$('questionList').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const uid=b.dataset.uid,st=store();
 if(b.dataset.act==='check'){if(!sel(st,uid).length){alert('Bạn chưa chọn đáp án.');return}st.checked[uid]=true}else st.flagged[uid]=!st.flagged[uid];
 save();renderCard(uid);updateUI()});
$('navgrid').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)$('q-'+b.dataset.go)?.scrollIntoView({block:'start'})});
$('sessGrid').addEventListener('click',e=>{const b=e.target.closest('[data-sess]');if(!b)return;ui.sess=b.dataset.sess;ui.topic='all';renderAll()});
$('toolbar').addEventListener('click',e=>{const b=e.target.closest('[data-tb]');if(!b)return;const st=state.practice;
 switch(b.dataset.tb){
  case'grade':gradePractice();break;
  case'reveal':state.reveal=!state.reveal;save();renderToolbar();renderList();break;
  case'shuffle':st.order=shuffle(Q.map(q=>q.uid));save();renderList();break;
  case'orig':st.order=null;save();renderList();break;
  case'reset':if(!confirm(`Xóa đáp án, kết quả kiểm tra và đánh dấu của ${currentIds.length} câu đang xem?`))return;currentIds.forEach(u=>{delete st.answers[u];delete st.checked[u];delete st.flagged[u]});st.started=Date.now();save();renderList();break;
  case'submit':submitExam(false);break;
  case'cancel':if(confirm('Hủy đề đang làm?')){state.exam=null;save();renderAll()}break;
  case'result':showResult(state.exam.ids,state.exam,'Kết quả bài thi');break;
  case'wrongOnly':ui.wrongOnly=!ui.wrongOnly;renderToolbar();renderList();break;
  case'newExam':state.exam=null;save();renderAll();break;
 }});
$('submitBottom').onclick=()=>{if(state.mode==='practice')gradePractice();else if(state.exam)state.exam.submitted?showResult(state.exam.ids,state.exam,'Kết quả bài thi'):submitExam(false)};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;ui.wrongOnly=false;save();renderAll();window.scrollTo({top:0})});
$('sessSelect').onchange=e=>{ui.sess=e.target.value;ui.topic='all';renderAll()};
$('topicSelect').onchange=e=>{ui.topic=e.target.value;renderList()};
let st0;$('search').addEventListener('input',e=>{clearTimeout(st0);st0=setTimeout(()=>{ui.term=e.target.value;renderList()},180)});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ui.filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderList()});
$('shuffleOpts').onchange=e=>{state.shuffleOpts=e.target.checked;save();renderList()};
$('startExam').onclick=startExam;
$('closeModal').onclick=()=>$('resultModal').classList.remove('show');
$('reviewWrong').onclick=()=>{$('resultModal').classList.remove('show');if(state.mode==='exam'){ui.wrongOnly=true;renderToolbar();renderList()}else{ui.filter='wrong';document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter==='wrong'));renderList()}window.scrollTo({top:0})};
$('resultModal').onclick=e=>{if(e.target.id==='resultModal')$('resultModal').classList.remove('show')};
$('examChips').innerHTML=DATA.map(s=>`<label class="chip"><input type="checkbox" value="${s.b}" checked>Buổi ${s.b}</label>`).join('');

/* ---------- đồng hồ ---------- */
function tick(){const t=$('timer');t.classList.remove('warn');
 if(inExam()){const ex=state.exam;
  if(ex.submitted){t.textContent=fmt(((ex.ended||Date.now())-ex.started)/1000);return}
  if(ex.duration){const left=ex.duration-(Date.now()-ex.started)/1000;t.textContent=fmt(left);if(left<=60)t.classList.add('warn');if(left<=0)submitExam(true)}
  else t.textContent=fmt((Date.now()-ex.started)/1000);
 }else if(state.mode==='exam')t.textContent='00:00:00';
 else t.textContent=fmt((Date.now()-state.practice.started)/1000)}
setInterval(tick,1000);
renderAll();tick();
</script></body></html>
